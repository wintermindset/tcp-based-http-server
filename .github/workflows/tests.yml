name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B --no-transfer-progress clean verify
      - run: python3 scripts/smoke.py --jar target/tcp-based-http-server-1.0.0.jar
      - run: python3 scripts/prepare_release.py
        if: matrix.java == 21
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.java == 21
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/spotbugsXml.xml
            target/smoke-*.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.java == 21
        with:
          name: application-jar
          path: target/tcp-based-http-server-1.0.0.jar

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B --no-transfer-progress -Dtest=ServerStressTest -Dstress=true -Dstress.seconds=30 -Dstress.concurrency=32 -DargLine=-Xmx256m test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stress-results
          path: target/stress-results.json

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t tcp-http:test .
      - run: python3 scripts/smoke.py --image tcp-http:test

  dependencies:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-jar
          path: application
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          path: application
          severity-cutoff: high
          fail-build: true
          output-format: table

  checks:
    if: always()
    needs: [build, stress, container, dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: python3 -c 'import json, os; assert all(r == "success" for r in json.loads(os.environ["RESULTS"]))'
