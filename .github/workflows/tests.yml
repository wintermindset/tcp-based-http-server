name: Java TCP based HTTP Server Tests

on:
  push:
    branches:
      - main
      - dev
      - feature/*
  pull_request:
    branches:
      - main
      - dev
      - feature/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn -B clean test

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run bounded stress test
        run: ./mvnw -B -Dtest=ServerStressTest -Dstress=true -Dstress.seconds=30 -Dstress.concurrency=32 -DargLine=-Xmx256m test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-results
          path: target/stress-results.json
